<div class="auth-container">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="emokorb.png" alt="EmoKorb" class="auth-brand-logo" />
    </div>
    <h1 class="auth-title">Bienvenido</h1>
    <p class="auth-subtitle">Inicia sesión para continuar</p>

    <form (ngSubmit)="submit()" class="auth-form">
      <div class="field">
        <label for="identificador">Email o username</label>
        <input id="identificador" type="text" [(ngModel)]="identificador" name="identificador"
          placeholder="usuario@ejemplo.com" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" [(ngModel)]="password" name="password"
          placeholder="••••••••" autocomplete="current-password" />
      </div>

      @if (error()) {
        <p class="error-msg">{{ error() }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="cargando()">
        {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="auth-link">
      ¿No tienes cuenta? <a routerLink="/auth/registro">Regístrate</a>
    </p>
  </div>
</div>
