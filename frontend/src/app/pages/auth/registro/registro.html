<div class="auth-container">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="emokorb.png" alt="EmoKorb" class="auth-brand-logo" />
    </div>
    <h1 class="auth-title">Crear cuenta</h1>

    <form (ngSubmit)="submit()" class="auth-form">
      <div class="fields-row">
        <div class="field">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" [(ngModel)]="form.nombre" name="nombre" placeholder="Juan" />
        </div>
        <div class="field">
          <label for="apellido">Apellido</label>
          <input id="apellido" type="text" [(ngModel)]="form.apellido" name="apellido" placeholder="Pérez" />
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" [(ngModel)]="form.email" name="email" placeholder="juan@ejemplo.com" />
      </div>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" [(ngModel)]="form.username" name="username" placeholder="juanperez" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" [(ngModel)]="form.password" name="password" placeholder="••••••••" />
      </div>

      @if (error()) {
        <p class="error-msg">{{ error() }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="cargando()">
        {{ cargando() ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="auth-link">
      ¿Ya tienes cuenta? <a routerLink="/auth/login">Inicia sesión</a>
    </p>
  </div>
</div>
